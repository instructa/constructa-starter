packages:
  - .

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
dangerouslyAllowAllBuilds: false
savePrefix: ""
strictDepBuilds: true
overrides:
  better-sqlite3: 12.9.0
  "fast-xml-parser@>=5.0.0 <5.3.5": 5.3.5
  "protobufjs@>=7.0.0 <7.5.5": 7.5.5
  "proxy-addr@>=1.1.0 <2.0.8": 2.0.8
  "seroval@>=0.12.0 <=1.6.0": 1.6.2
  "seroval-plugins@<1.6.2": 1.6.2
  "simple-git@>=3.15.0 <4.0.2": 4.0.2
  "tar@<=7.5.18": 7.5.19
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': false
  '@tailwindcss/oxide': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  protobufjs: false
  unrs-resolver: true
